<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AZADOR-web | Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="azador.css">
<style>
.cl{display:grid;grid-template-columns:1fr 330px;gap:1.2rem;padding-block:1.5rem;align-items:start}
@media(max-width:860px){.cl{grid-template-columns:1fr}}
.side h3{margin-top:1.2rem}.side h3:first-child{margin-top:0}
.idea{margin-top:.8rem;padding:.8rem 1rem;background:var(--s2);border-radius:12px;font-size:.95rem;white-space:pre-wrap;overflow-wrap:anywhere}
.nf{grid-column:1/-1;text-align:center;padding:3rem 1rem;display:grid;gap:1rem;justify-items:center}
.nf form{display:flex;gap:.5rem;width:min(420px,100%)}
</style>
</head>
<body>
<header class="hdr"><div class="wrap">
  <a href="index.html" class="logo">AZADOR<span>-web</span></a>
  <div class="act">
    <span class="tag" id="oid" dir="ltr"></span>
    <div class="lang"><button data-l="ar">AR</button><button data-l="fr">FR</button><button data-l="en">EN</button></div>
    <button id="themeBtn" class="btn gh sm"></button>
  </div>
</div></header>
<main class="wrap cl" id="app">
  <section class="card chat enter" id="chat"></section>
  <aside class="card side" id="side"></aside>
</main>

<div class="modal" id="pm" hidden role="dialog" aria-modal="true" aria-labelledby="pmT"><div class="mbox" id="pmb"></div></div>
<div class="modal" id="dm" hidden role="dialog" aria-modal="true" aria-labelledby="dmT"><div class="mbox dmb" id="dmb"></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="azador.js"></script>
<script>if(typeof AZ==="undefined")document.body.innerHTML='<p style="padding:2rem;font:700 18px/1.8 sans-serif;color:#ff6b7a;direction:rtl">ملف azador.js غير موجود. ضع index.html وclient.html وadmin.html وazador.js وazador.css كلها في نفس المجلد ثم حدّث الصفحة.</p>'</script>

,vRej:"✕ Payment not accepted",retryPay:"Try again",vOk:"✓ Payment verified",sysSub:"Payment details sent. The admin will verify the account and that the money arrived before delivering the final link.",sysOk:"✓ Payment verified, delivery activated.",sysNo:"✕ Payment could not be verified",nfd:"Check the order number and try again, or go back home.",tried:"Entered number",idPh:"Order number e.g. AZD-7K3M9QXP",retry:"Try again",badId:"Invalid format (e.g. AZD-7K3M9QXP).",demoBtn:"View demo",dmT:"Preview your site",newTab:"Open in a new tab",waBtn:"Contact / confirm payment on WhatsApp",waRip:"Request the RIP on WhatsApp",waPay:"Hello, my order is {id}. I’d like to confirm payment and get the RIP.",waAsk:"Hello, my order is {id}. I have a question.",errNet:"Couldn’t reach the server. Check your connection and try again."}
};
const id = new URLSearchParams(location.search).get("order") || "";
let lang = X[AZ.ls("lang")] ? AZ.ls("lang") : "ar", off;

const money = n => AZ.money(n, lang);

function side() {
  const o = AZ.DB.get(id), L = X[lang]; if (!o || !$("#side")) return;
  const i = AZ.STAGES.indexOf(o.status === "closed" ? "delivered" : o.status), e = AZ.esc, c = o.ccp, st = c && c.status, due = Math.max(0, o.price - AZ.paid(o));
  $("#oid").textContent = o.id; $("#oid").dataset.s = o.status;
  let dl = "";
  const wab = `<div class="wab"><a class="btn wide wa-btn" href="${AZ.wa(L[o.demoUrl && !o.unlocked ? "waPay" : "waAsk"].replace("{id}", o.id))}" target="_blank" rel="noopener">${L.waBtn}</a></div>`;
  if (o.unlocked && o.finalUrl) { // بعد تأكيد الدفع: الرابط النهائي + زر النسخ
    dl = `<div class="dlv fin"><div class="vs ok">${L.vOk}</div><h3>${L.finT}</h3><code dir="ltr">${e(o.finalUrl)}</code><div class="lka"><a class="btn gh sm" href="${e(o.finalUrl)}" target="_blank" rel="noopener">${L.open}</a><button type="button" class="btn pri sm" data-copy="${e(o.finalUrl)}" data-t="${L.copy}" data-ok="${L.copied}" data-f="${L.copyFail}" aria-live="polite">${L.copy}</button></div></div>`;
  } else if (o.demoUrl) { // قبل الدفع: الديمو + زر الشراء + حالة التحقق
    const vs = st === "pending" ? `<div class="vs pend">${L.vPend}</div>` : st === "rejected" ? `<div class="vs rej">${L.vRej}${c.reason ? ": " + e(c.reason) : ""}</div>` : "";
    const btn = !o.price ? `<p class="muted">${L.noPrice}</p>` : st === "pending" ? "" : `<button type="button" class="btn pri wide" data-buy>${st === "rejected" ? L.retryPay : L.buy}</button>`;
    dl = `<div class="dlv"><h3>${L.demo}</h3><p class="muted">${L.demoNote}</p><div class="lka"><button type="button" class="btn gh sm" data-demo>${L.demoBtn}</button></div></div>`
      + `<div class="dlv"><h3>${L.payT}</h3><p class="muted">${L.buyNote}</p>${o.price ? `<div class="kv"><span>${L.due}</span><b>${money(due)}</b></div>` : ""}${vs}${btn}</div>`;
  }
  $("#side").innerHTML = `<h3>${L.st}</h3><ol class="stages">${AZ.STAGES.map((s, k) => `<li class="${k < i ? "done" : k === i ? "cur" : ""}">${AZ.ST[s][lang]}</li>`).join("")}</ol>`
    + (o.price ? `<div class="kv"><span>${L.pr}</span><b>${money(o.price)}</b></div><div class="kv"><span>${L.pd}</span><b>${money(AZ.paid(o))}</b></div>` : "")
    + dl
    + `<h3>${L.req}</h3><div class="chips">${o.options.map(x => `<span class="tag">${e(x.t[lang])}</span>`).join("")}</div>`
    + (o.budget ? `<div class="kv"><span>${L.bud}</span><b>${money(o.budget)}</b></div>` : o.budgetLater ? `<p class="muted">${L.later}</p>` : "")
    + (o.freeText ? `<p class="idea">${e(o.freeText)}</p>` : "") + wab;
}

/* ---- نافذة الشراء عبر CCP ---- */
let lastFocus = null;
function closePay() { $$(".modal").forEach(m => m.hidden = true); $("#dmb").innerHTML = ""; document.body.style.overflow = ""; lastFocus && lastFocus.focus && lastFocus.focus(); }
function openPay() {
  const o = AZ.DB.get(id), L = X[lang], e = AZ.esc, a = AZ.ccp(), c = o.ccp || {};
  if (o.unlocked || c.status === "pending") return;
  lastFocus = document.activeElement;
  const cp = v => `<button type="button" class="btn gh sm" data-copy="${e(v)}" data-t="${L.copy}" data-ok="${L.copied}" data-f="${L.copyFail}">${L.copy}</button>`;
  const acct = a.num ? [[L.aNum, a.num], [L.aKey, a.key], [L.aName, a.name]].map(([k, v]) => `<div class="kv"><span>${k}</span><span><b dir="ltr">${e(v)}</b>${cp(v)}</span></div>`).join("") : `<p class="err">${L.noAcct}</p>`;
  const fld = (n, lab, v, x) => `<label class="fld"><span>${lab}</span><input name="${n}" value="${e(v || "")}" ${x}><small class="e" data-e="${n}"></small></label>`;
  $("#pmb").innerHTML = `<button type="button" class="mclose" data-close aria-label="${L.cancel}">×</button><h2 id="pmT">${L.payT}</h2>
    <div class="acct"><h3>${L.toAcct}</h3>${acct}<div class="kv"><span>${L.amount}</span><b>${o.price ? money(o.price) : "—"}</b></div>${o.price ? "" : `<p class="err">${L.noPrice}</p>`}<a class="btn gh sm" href="${AZ.wa(L.waPay.replace("{id}", o.id))}" target="_blank" rel="noopener">${L.waRip}</a></div>
    <form id="pf" novalidate><h3>${L.yourInfo}</h3>
      <div class="row2">${fld("num", L.aNum, c.num, 'inputmode="numeric" dir="ltr" autocomplete="off" maxlength="14"')}${fld("key", L.aKey, c.key, 'inputmode="numeric" dir="ltr" autocomplete="off" maxlength="2"')}</div>
      ${fld("name", L.aName, c.name, 'autocomplete="off" maxlength="60"')}${fld("ref", L.fRef, c.ref, 'dir="ltr" autocomplete="off" maxlength="30"')}
      <label class="chk"><input type="checkbox" name="ok"><span>${L.fOk}</span></label><small class="e" data-e="ok"></small>
      <div class="nbox">${L.pmNote}</div><p class="errsum" id="pe" role="alert" hidden></p>
      <div class="mact"><button type="button" class="btn gh" data-close>${L.cancel}</button><button class="btn pri">${L.pSend}</button></div></form>`;
  const F = $("#pf").elements;
  $("#pf").oninput = ev => { const s = $(`#pf [data-e="${ev.target.name}"]`); if (s) s.textContent = ""; ev.target.removeAttribute("aria-invalid"); };
  $("#pf").onsubmit = ev => {
    ev.preventDefault();
    const r = AZ.ccpCheck({ num: F.namedItem("num").value, key: F.namedItem("key").value, name: F.namedItem("name").value, ref: F.namedItem("ref").value, ok: F.namedItem("ok").checked });
    $$("#pf [data-e]").forEach(s => { const k = s.dataset.e, cd = r.err[k]; s.textContent = cd ? (cd === "req" && k !== "ok" ? L.e.req : L.e[k]) : ""; F.namedItem(k).setAttribute("aria-invalid", String(!!cd)); });
    const bad = Object.keys(r.err), pe = $("#pe");
    if (!AZ.DB.get(id).price) { pe.textContent = L.noPrice; pe.hidden = false; return; }
    pe.hidden = !bad.length; pe.textContent = L.errSum;
    if (bad.length) { F.namedItem(bad[0]).focus(); return; }
    AZ.DB.update(id, x => { x.ccp = { status: "pending", ...r.v, amount: x.price, t: Date.now() }; x.messages.push({ from: "client", kind: "paysub", t: Date.now() }); });
    closePay();
  };
  $("#pm").hidden = false; document.body.style.overflow = "hidden"; $("#pf input").focus();
}
function openDemo() { // معاينة الموقع داخل iframe بدون إظهار الرابط نصياً
  const o = AZ.DB.get(id), L = X[lang], e = AZ.esc; if (!o || !o.demoUrl) return;
  lastFocus = document.activeElement;
  $("#dmb").innerHTML = `<div class="dmh"><b id="dmT">${L.dmT}</b><div class="lka"><a class="btn gh sm" href="${e(o.demoUrl)}" target="_blank" rel="noopener noreferrer">${L.newTab}</a><button type="button" class="dmx" data-close aria-label="${L.cancel}">×</button></div></div>`
    + `<iframe class="dmf" title="${L.dmT}" src="${e(o.demoUrl)}" referrerpolicy="no-referrer" sandbox="allow-scripts allow-forms allow-popups allow-same-origin"></iframe>`;
  $("#dm").hidden = false; document.body.style.overflow = "hidden"; $(".dmx").focus();
}
document.addEventListener("click", ev => {
  if (ev.target.closest("[data-buy]")) openPay();
  else if (ev.target.closest("[data-demo]")) openDemo();
  else if (ev.target.closest("[data-close]") || ev.target.classList.contains("modal")) closePay();
});
document.addEventListener("keydown", ev => {
  const md = [...$$(".modal")].find(m => !m.hidden); if (!md) return;
  if (ev.key === "Escape") closePay();
  if (ev.key === "Tab") { const f = [...md.querySelectorAll("button,input,a[href]")].filter(x => !x.disabled), a = f[0], z = f[f.length - 1];
    if (ev.shiftKey && document.activeElement === a) { ev.preventDefault(); z.focus(); } else if (!ev.shiftKey && document.activeElement === z) { ev.preventDefault(); a.focus(); } }
});

/* ---- طلب غير موجود: رسالة واضحة + إعادة المحاولة ---- */
function notFound(L) { // طلب غير موجود (أو تعذّر الاتصال)
  $("#oid").hidden = true;
  $("#app").innerHTML = `<div class="card nf"><h2>${netErr ? L.errNet : L.nf}</h2>`
    + (netErr ? `<button class="btn pri" onclick="location.reload()">${L.retry}</button>`
      : `<p class="muted">${id ? `${L.tried}: <b dir="ltr">${AZ.esc(id)}</b><br>` : ""}${L.nfd}</p>
    <form id="nff"><input id="nid" dir="ltr" placeholder="${L.idPh}" aria-label="${L.idPh}" autocomplete="off"><button class="btn pri">${L.retry}</button></form><p class="err" id="nfe" role="alert"></p>`)
    + `<a class="btn gh" href="index.html">${L.back}</a></div>`;
  if ($("#nff")) $("#nff").onsubmit = ev => {
    ev.preventDefault(); const v = $("#nid").value.trim().toUpperCase().replace(/^AZD-?/, "");
    if (!/^[A-Z0-9]{8}$/.test(v)) { $("#nfe").textContent = L.badId; $("#nid").setAttribute("aria-invalid", "true"); return; }
    location.href = "client.html?order=AZD-" + v;
  };
}

function paint() {
  const L = X[lang], h = document.documentElement;
  h.lang = lang; h.dir = lang === "ar" ? "rtl" : "ltr";
  $$(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
  $("#themeBtn").textContent = L.th;
  closePay();
  if (!AZ.DB.get(id)) { notFound(L); return; }
  $("#oid").hidden = false;
  side(); off && off();
  off = AZ.Chat.mount($("#chat"), id, "client", { ...L, lang, title: "AZADOR-web" });
}

$$(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.l; AZ.ls("lang", lang); paint(); });
